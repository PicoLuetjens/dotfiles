# ------------------------------------------------------------
# kitty Konfiguration
# Angelehnt an .wezterm.lua (gleiche Schrift, Farben, Tasten)
# Neu laden: Strg+Shift+R   |   Alle Optionen: kitty.conf(5)
# ------------------------------------------------------------

# Farbschema (eigene Datei im selben Ordner)
include catppuccin-mocha.conf

# ------------------------------------------------------------
# Shell
# ------------------------------------------------------------
shell zsh

# ------------------------------------------------------------
# Schrift
# ------------------------------------------------------------
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ------------------------------------------------------------
# Fenster
# ------------------------------------------------------------
background_opacity  0.82
remember_window_size no
initial_window_width  120c
initial_window_height 35c
window_padding_width  4
confirm_os_window_close 0

# Rahmen zwischen geteilten Bereichen
active_border_color   #b4befe
inactive_border_color #6c7086

# ------------------------------------------------------------
# Cursor
# ------------------------------------------------------------
cursor_shape               beam
cursor_blink_interval      0.5
cursor_stop_blinking_after 0

# ------------------------------------------------------------
# Verlauf
# ------------------------------------------------------------
scrollback_lines 10000

# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------
tab_bar_edge      top
tab_bar_style     powerline
tab_powerline_style slanted
tab_bar_min_tabs  2

# ------------------------------------------------------------
# Sonstiges
# ------------------------------------------------------------
enable_audio_bell no
copy_on_select    no
strip_trailing_spaces smart

# Layout "splits" erlaubt horizontales und vertikales Teilen
enabled_layouts splits,stack

# ------------------------------------------------------------
# Tastenkürzel (wie in WezTerm)
# ------------------------------------------------------------

# Neuer Tab / Tab wechseln
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab

# Teilen: Alt+Shift+D = nebeneinander, Strg+Shift+D = untereinander
map alt+shift+d  launch --location=vsplit --cwd=current
map ctrl+shift+d launch --location=hsplit --cwd=current

# Zwischen Bereichen wechseln
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# Aktuellen Bereich schließen
map ctrl+shift+w close_window

# Konfiguration neu laden
map ctrl+shift+r load_config_file

# Befehlspalette (alle Aktionen durchsuchen, wie in WezTerm)
map ctrl+shift+p command_palette
